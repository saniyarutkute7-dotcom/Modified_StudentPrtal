<!DOCTYPE html>
<html lang="en">

<head>
    <script src="portal.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">

<title>Student Portal - Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    color:#333;
}

nav{
    background:#243b55;
    padding:18px 30px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:white;
    font-size:22px;
    font-weight:bold;
}

.nav-links{
    display:flex;
    gap:25px;
}

.nav-links a{
    color:white;
    text-decoration:none;
}

.container{
    width:90%;
    max-width:900px;
    margin:40px auto;
}

h1{
    text-align:center;
    color:#243b55;
    margin-bottom:30px;
}

.box{
    background:white;
    padding:25px;
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.box h2{
    color:#243b55;
    margin-bottom:20px;
}

.info{
    display:flex;
    justify-content:space-between;
    padding:13px;
    margin-bottom:8px;
    background:#eef4fb;
    border-radius:7px;
}

.subject{
    padding:12px;
    background:#eef4fb;
    border-radius:7px;
    margin-bottom:8px;
}

.performance{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.performance-card{
    flex:1;
    min-width:200px;
    text-align:center;
    background:#eef4fb;
    padding:25px;
    border-radius:10px;
}

.performance-card h3{
    color:#243b55;
    margin-bottom:10px;
}

.performance-card p{
    font-size:25px;
    font-weight:bold;
}

footer{
    background:#243b55;
    color:white;
    text-align:center;
    padding:18px;
    margin-top:40px;
}

@media(max-width:700px){

    nav{
        flex-direction:column;
        gap:15px;
    }

    .nav-links{
        flex-wrap:wrap;
        justify-content:center;
    }

    .info{
        flex-direction:column;
        gap:5px;
    }

}

</style>

</head>

<body>

<nav>

<div class="logo">
Student Portal
</div>

<div class="nav-links">

<a href="home.html">Home</a>

<a href="dashboard.html">Dashboard</a>

   
<a href="#" onclick="logout()">Logout</a>
</div>

</nav>


<div class="container">

<h1>👤 Student Profile</h1>


<!-- PERSONAL INFORMATION -->

<div class="box">

<h2>Personal Information</h2>

<div class="info">

<strong>Name</strong>

<span id="name">Not Available</span>

</div>


<div class="info">

<strong>Course</strong>

<span id="course">Not Available</span>

</div>


<div class="info">

<strong>Year</strong>

<span id="year">Not Available</span>

</div>


<div class="info">

<strong>Semester</strong>

<span id="semester">Not Available</span>

</div>

</div>


<!-- PERFORMANCE -->

<div class="box">

<h2>Academic Performance</h2>

<div class="performance">

<div class="performance-card">

<h3>SGPA</h3>

<p id="sgpa">-</p>

</div>


<div class="performance-card">

<h3>CGPA</h3>

<p id="cgpa">-</p>

</div>

</div>

</div>


<!-- SUBJECTS -->

<div class="box">

<h2>Subjects</h2>

<div id="subjects"></div>

</div>


<!-- ATTENDANCE -->

<div class="box">

<h2>Attendance</h2>

<div id="attendance"></div>

</div>


<!-- MARK LIST -->

<div class="box">

<h2>Mark List</h2>

<div id="marks"></div>

</div>


</div>


<footer>

<p>© 2026 Student Portal | BCA</p>

</footer>


<script>
(function () {
    "use strict";

    // Always read the profile for the CURRENT logged-in username.
    // Do not use a global studentData object, because that can show another
    // student's information after switching accounts.
    const username = Portal.getCurrentUsername();
    const isLoggedIn = localStorage.getItem("isLoggedIn") === "true";
    const student = username ? Portal.getStudentProfile(username) : null;

    window.addEventListener("pageshow", function (event) {
        if (event && event.persisted) {
            window.location.reload();
        }
    });

    if (!isLoggedIn || !username || !student) {
        window.location.replace("index.html");
        return;
    }

    function text(id, value) {
        const el = document.getElementById(id);
        if (el) el.textContent = value || "Not Available";
    }

    text("name", student.fullName || student.name);
    text("course", student.course);
    text("year", student.year);
    text("semester", student.semester);

    // Show extra account information when the existing profile page contains
    // matching fields. This keeps the existing design intact.
    text("studentId", student.studentId);
    text("phone", student.phone);
    text("email", student.email);
    text("college", student.college);
    text("academicYear", student.academicYear);
    text("username", student.username || username);

    const performance = JSON.parse(localStorage.getItem("performance") || "null");
    if (performance) {
        text("sgpa", performance.sgpa);
        text("cgpa", performance.cgpa);
    }

    const subjects = JSON.parse(localStorage.getItem("subjects") || "[]");
    const subjectContainer = document.getElementById("subjects");
    if (subjectContainer) {
        subjectContainer.innerHTML = "";
        if (!Array.isArray(subjects) || subjects.length === 0) {
            subjectContainer.innerHTML = "<p>No subjects added.</p>";
        } else {
            subjects.forEach(function (subject) {
                const div = document.createElement("div");
                div.className = "subject";
                div.textContent = "📚 " + subject;
                subjectContainer.appendChild(div);
            });
        }
    }

    const marks = JSON.parse(localStorage.getItem("markList") || "[]");
    const marksContainer = document.getElementById("marks");
    if (marksContainer) {
        marksContainer.innerHTML = "";
        if (!Array.isArray(marks) || marks.length === 0) {
            marksContainer.innerHTML = "<p>No marks added.</p>";
        } else {
            marks.forEach(function (item) {
                const div = document.createElement("div");
                div.className = "subject";
                div.innerHTML = "<strong></strong><br>Marks: <span></span><br>Grade: <span></span>";
                div.querySelector("strong").textContent = item.subject || "";
                div.querySelectorAll("span")[0].textContent = item.marks || "";
                div.querySelectorAll("span")[1].textContent = item.grade || "";
                marksContainer.appendChild(div);
            });
        }
    }

    const attendance = JSON.parse(localStorage.getItem("attendance") || "[]");
    const attendanceContainer = document.getElementById("attendance");
    if (attendanceContainer) {
        attendanceContainer.innerHTML = "";
        if (!Array.isArray(attendance) || attendance.length === 0) {
            attendanceContainer.innerHTML = "<p>No attendance records.</p>";
        } else {
            const bySubject = {};
            attendance.forEach(function (item) {
                const subject = item.subject || "Unknown Subject";
                if (!bySubject[subject]) bySubject[subject] = { total: 0, present: 0 };
                bySubject[subject].total++;
                if (item.status === "Present") bySubject[subject].present++;
            });

            Object.keys(bySubject).forEach(function (subject) {
                const data = bySubject[subject];
                const percentage = data.total ? ((data.present / data.total) * 100).toFixed(2) : "0.00";
                const div = document.createElement("div");
                div.className = "subject";
                div.innerHTML = "<strong></strong><br>Present: " + data.present + "/" + data.total + "<br>Attendance: " + percentage + "%";
                div.querySelector("strong").textContent = subject;
                attendanceContainer.appendChild(div);
            });
        }
    }

    function logout() {
        Portal.logout();
        window.location.replace("index.html");
    }

    window.logout = logout;
})();
</script>

</body>

</html>

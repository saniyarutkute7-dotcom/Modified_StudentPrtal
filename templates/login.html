<!DOCTYPE html>
<html lang="en">
<head>
    <script src="portal.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
    <title>Student Portal - Login</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#f4f6f9;
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
            color:#333;
            font-family:"Times New Roman", serif;
        }
        .login-container {
            width:100%;
            max-width:650px;
            background:#fff;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,.12);
        }
        .title { text-align:center; margin-bottom:22px; }
        .title h1 { color:#1e3a8a; font-size:32px; font-style:italic; margin-bottom:4px; }
        .title p { color:#777; font-style:italic; }
        .section-title {
            color:#1e3a8a;
            font-size:20px;
            font-style:italic;
            margin:20px 0 10px;
            border-bottom:2px solid #e5e7eb;
            padding-bottom:7px;
        }
        .form-row { display:flex; gap:14px; }
        .form-group { flex:1; margin-bottom:12px; }
        label { display:block; margin-bottom:5px; font-style:italic; color:#333; font-size:14px; }
        input, select {
            width:100%; padding:11px;
            border:1px solid #ccc; border-radius:7px;
            font-family:"Times New Roman", serif; font-size:15px;
            outline:none; background:#fff;
        }
        input:focus, select:focus { border-color:#1e3a8a; }
        .login-button {
            width:100%; padding:12px; margin-top:8px;
            background:#23439a; color:#fff; border:none; border-radius:7px;
            font-family:"Times New Roman", serif; font-size:16px; font-style:italic;
            cursor:pointer;
        }
        .login-button:hover { background:#1e3a8a; }
        .note { text-align:center; color:#777; font-size:13px; font-style:italic; margin-top:10px; }
        .message { display:none; text-align:center; font-weight:bold; margin-top:10px; font-size:14px; }
        .account-hint { color:#2874a6; }
        .error { color:#c0392b; }
        @media (max-width:600px) {
            .login-container { padding:25px 20px; }
            .form-row { flex-direction:column; gap:0; }
            .title h1 { font-size:28px; }
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="title">
        <h1>Student Portal</h1>
        <p>Enter your details to continue</p>
    </div>

    <form id="loginForm" autocomplete="on">
        <h2 class="section-title">Personal Information</h2>

        <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" placeholder="Enter your full name" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="studentId">Student ID / USN *</label>
                <input type="text" id="studentId" placeholder="Enter Student ID / USN" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" placeholder="Enter email address" required>
        </div>

        <h2 class="section-title">Academic Information</h2>
        <div class="form-row">
            <div class="form-group">
                <label for="course">Course *</label>
                <select id="course" required>
                    <option value="">Select Course</option>
                    <option value="BCA">BCA</option>
                    <option value="BBA">BBA</option>
                    <option value="BCOM">B.Com</option>
                    <option value="BA">BA</option>
                    <option value="BSc">B.Sc</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="year">Year *</label>
                <select id="year" required>
                    <option value="">Select Year</option>
                    <option value="1st Year">1st Year</option>
                    <option value="2nd Year">2nd Year</option>
                    <option value="3rd Year">3rd Year</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="semester">Semester *</label>
                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option value="1st Semester">1st Semester</option>
                    <option value="2nd Semester">2nd Semester</option>
                    <option value="3rd Semester">3rd Semester</option>
                    <option value="4th Semester">4th Semester</option>
                    <option value="5th Semester">5th Semester</option>
                    <option value="6th Semester">6th Semester</option>
                </select>
            </div>
            <div class="form-group">
                <label for="academicYear">Academic Year *</label>
                <input type="text" id="academicYear" placeholder="Example: 2026 - 2027" required>
            </div>
        </div>

        <div class="form-group">
            <label for="college">College Name *</label>
            <input type="text" id="college" placeholder="Enter your college name" required>
        </div>

        <h2 class="section-title">Login Information</h2>
        <div class="form-group">
            <label for="username">Username *</label>
            <input type="text" id="username" placeholder="Create your username" autocomplete="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password *</label>
            <input type="password" id="password" placeholder="Create your password" autocomplete="new-password" required>
        </div>

        <button type="submit" class="login-button">LOGIN</button>
        <p class="note">* Please fill all required fields before logging in.</p>
        <p class="message account-hint" id="accountMessage"></p>
        <p class="message error" id="errorMessage"></p>
    </form>
</div>

<script>
(function () {
    "use strict";

    var form = document.getElementById("loginForm");
    var usernameInput = document.getElementById("username");
    var passwordInput = document.getElementById("password");
    var accountMessage = document.getElementById("accountMessage");
    var errorMessage = document.getElementById("errorMessage");

    function setMessage(element, text) {
        element.textContent = text;
        element.style.display = text ? "block" : "none";
    }

    function fillProfile(student) {
        if (!student) return;
        document.getElementById("fullName").value = student.fullName || "";
        document.getElementById("studentId").value = student.studentId || "";
        document.getElementById("phone").value = student.phone || "";
        document.getElementById("email").value = student.email || "";
        document.getElementById("course").value = student.course || "";
        document.getElementById("year").value = student.year || "";
        document.getElementById("semester").value = student.semester || "";
        document.getElementById("academicYear").value = student.academicYear || "";
        document.getElementById("college").value = student.college || "";
    }

    function clearProfileFields() {
        ["fullName", "studentId", "phone", "email", "course", "year", "semester", "academicYear", "college"].forEach(function (id) {
            var el = document.getElementById(id);
            if (el) el.value = "";
        });
    }

    usernameInput.addEventListener("blur", function () {
        var username = usernameInput.value.trim();
        setMessage(accountMessage, "");
        setMessage(errorMessage, "");
        if (!username) return;

        var saved = Portal.loadStudentProfile(username);
        if (saved) {
            fillProfile(saved);
            setMessage(accountMessage, "Existing student account found. Enter its password to load the saved data.");
            passwordInput.autocomplete = "current-password";
        } else {
            /* Do not let the previous student's browser-filled details leak into
             * a newly entered account. */
            clearProfileFields();
            passwordInput.value = "";
            passwordInput.autocomplete = "new-password";
        }
    });

    form.addEventListener("submit", function (event) {
        event.preventDefault();
        setMessage(accountMessage, "");
        setMessage(errorMessage, "");

        var profile = {
            fullName: document.getElementById("fullName").value.trim(),
            studentId: document.getElementById("studentId").value.trim(),
            phone: document.getElementById("phone").value.trim(),
            email: document.getElementById("email").value.trim(),
            course: document.getElementById("course").value,
            year: document.getElementById("year").value,
            semester: document.getElementById("semester").value,
            academicYear: document.getElementById("academicYear").value.trim(),
            college: document.getElementById("college").value.trim()
        };

        Portal.selectStudent(profile, usernameInput.value, passwordInput.value)
            .then(function (result) {
                if (result.ok) {
                    window.location.replace("home.html");
                } else {
                    setMessage(errorMessage, result.error || "Unable to login.");
                }
            })
            .catch(function () {
                setMessage(errorMessage, "Unable to save/login. Please try again.");
            });
    });
})();
</script>
</body>
</html>
